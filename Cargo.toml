[package]
name = "cliproxyapi-rust"
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
description = "One fast binary that turns your Claude, ChatGPT, Gemini, Antigravity, Grok, Kimi, Meta, Devin and Vertex accounts into OpenAI, Anthropic and Gemini compatible APIs."
license = "Unlicense"
repository = "https://github.com/IuCC123/CLIProxyAPI-Rust"
homepage = "https://github.com/IuCC123/CLIProxyAPI-Rust"
keywords = ["llm", "proxy", "claude", "openai", "gemini"]
categories = ["command-line-utilities", "web-programming::http-server"]
readme = "README.md"

[dependencies]
anyhow = "1"
arc-swap = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bcrypt = "0.19"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
open = "5"
parking_lot = "0.12"
rand = "0.9"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "brotli", "zstd", "deflate", "socks", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
yaml-edit = { version = "0.3.2", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
